on:
  push:
    branches: [ main ]




env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/devops-web-app
  EC2_HOST: ${{ secrets.EC2_HOST }}




Step 1 - Checkout:
- name: Checkout code
  uses: actions/checkout@v3




Step 2 - Setup Docker Buildx:
- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v2



Step 3 - Docker Login:

- name: Login to Docker Hub
  uses: docker/login-action@v2
  with:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}




Step 4 - Build and Push:
- name: Build and push Docker image
  uses: docker/build-push-action@v4
  with:
    context: ./app
    push: true
    tags: |
      ${{ env.DOCKER_IMAGE }}:latest
      ${{ env.DOCKER_IMAGE }}:${{ github.sha }}




Step 5 - Deploy to EC2:
- name: Deploy to EC2
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ec2-user
    key: ${{ secrets.EC2_SSH_KEY }}
    script: |
      docker pull ${{ env.DOCKER_IMAGE }}:latest
      docker stop web-app || true
      docker rm web-app || true
      docker run -d -p 80:5000 --name web-app --restart unless-stopped ${{ env.DOCKER_IMAGE }}:latest


Step 6 - Verify:
- name: Verify deployment
  run: |
    sleep 10
    curl -f http://${{ secrets.EC2_HOST }}/health || exit 1




