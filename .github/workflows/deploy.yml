
Let's break down what each part does:

#### **Trigger Section:**

on:
  push:
    branches: [ main ]

#**Meaning:** Run this pipeline whenever code is pushed to the `main` branch



#### **Environment Variables:**
env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/devops-web-app
  EC2_HOST: ${{ secrets.EC2_HOST }}
#**Meaning:** Define variables used throughout the pipeline (using secrets for security)



#### **Job Steps:**

Step 1 - Checkout:
- name: Checkout code
  uses: actions/checkout@v3

#**Meaning:** Download your code from GitHub repository



Step 2 - Setup Docker Buildx:
- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v2
#**Meaning:** Prepare Docker for faster, better builds



Step 3 - Docker Login:

- name: Login to Docker Hub
  uses: docker/login-action@v2
  with:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

#**Meaning:** Login to Docker Hub using credentials stored in GitHub Secrets



Step 4 - Build and Push:
- name: Build and push Docker image
  uses: docker/build-push-action@v4
  with:
    context: ./app
    push: true
    tags: |
      ${{ env.DOCKER_IMAGE }}:latest
      ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

#**Meaning:** 
#- Build Docker image from `./app` directory
#- Push to Docker Hub with two tags:
 # - `latest` - Always points to newest version
  #- `sha` - Unique identifier for this specific version (e.g., `abc123def456`)



Step 5 - Deploy to EC2:
- name: Deploy to EC2
  uses: appleboy/ssh-action@master
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ec2-user
    key: ${{ secrets.EC2_SSH_KEY }}
    script: |
      docker pull ${{ env.DOCKER_IMAGE }}:latest
      docker stop web-app || true
      docker rm web-app || true
      docker run -d -p 80:5000 --name web-app --restart unless-stopped ${{ env.DOCKER_IMAGE }}:latest

#**Meaning:**
#- SSH into your EC2 instance
#- Pull the new Docker image
#- Stop old container (if running)
#- Remove old container
#- Start new container with updated image

Step 6 - Verify:
- name: Verify deployment
  run: |
    sleep 10
    curl -f http://${{ secrets.EC2_HOST }}/health || exit 1

#**Meaning:**
#- Wait 10 seconds for container to start
#- Test the `/health` endpoint
#- If health check fails, mark pipeline as failed



